name: Build NICO IPTV 0.18

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-0.9.yml'
      - 'NicoIPTV-0.18-codigo.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source
        run: |
          unzip -q NicoIPTV-0.18-codigo.zip -d project
          chmod +x project/gradlew
          sed -i '/signingConfig signingConfigs.release/d' project/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build unsigned APK
        working-directory: project
        run: ./gradlew assembleRelease
      - name: Package source
        run: |
          cd project
          zip -qr ../NicoIPTV-0.18-codigo.zip . -x '.gradle/*' 'app/build/*'
      - uses: actions/upload-artifact@v4
        with:
          name: NicoIPTV-0.18-build
          path: |
            project/app/build/outputs/apk/release/app-release-unsigned.apk
            NicoIPTV-0.18-codigo.zip
          if-no-files-found: error
